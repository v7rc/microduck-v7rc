name: Integration portability
on: [push, pull_request]
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        # The shared arm64 pool failed provisioning; keep the same checks on Intel.
        os: [ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1
      - run: python -m pip install mujoco==3.10.0 numpy==2.4.1 Pillow==12.2.0
      - run: python -m unittest discover -s tests -v
      - run: sh -n scripts/microduck-sim scripts/v7rc-bridge scripts/setup
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/windows/microduck-v7rc.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - shell: pwsh
        run: ./tests/check-wsl-launcher.ps1
